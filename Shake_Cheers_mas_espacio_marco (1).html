<html><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
  /* Ajuste fino para celulares verticales: mantener marca y frase en bloques armoniosos */
  @media (max-width: 479px) {
    h1 { font-size: clamp(30px, 8.2vw, 39px); line-height: 1.08; letter-spacing: -0.015em; }
    .tagline { font-size: clamp(15px, 4.1vw, 18px); line-height: 1.22; }
    .tagline span { max-width: 100%; }
  }
  @media (max-width: 360px) {
    h1 { font-size: clamp(28px, 7.8vw, 32px); }
    .tagline { font-size: 15px; line-height: 1.2; }
  }
</style>


</head><body>
<title>Shake &amp; Cheers</title>
<meta content="cover" name="claude:viewport-fit-sides"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&amp;family=Jost:wght@300;400;500&amp;display=swap" rel="stylesheet"/>
<style>
  /* Layout: one centered card framed by a hairline gold border, like the flyer; single column, thumb-sized contact buttons */
  :root {
    --bg: #111f2d;          /* navy, same as logo and flyer */
    --bg-lift: #172a3c;     /* hover/press surface */
    --gold: #c9a55a;        /* ampersand, rings, icons */
    --champagne: #aba189;   /* soft text, same tone as "By Harold A" */
    --cream: #f3ecdf;       /* title and tagline */
    --copper: #a06a3f;      /* diamond accent */
    --frame: #6b5a42;       /* outer hairline */
    --font-display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
    --font-body: "Jost", "Helvetica Neue", Arial, system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--champagne);
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 16px;
    line-height: 1.5;
    padding-block: 20px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-text-size-adjust: 100%;
  }
  .card {
    max-width: 520px;
    margin-inline: auto;
    border: 1px solid var(--frame);
    padding: 40px 20px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    text-align: center;
  }

  /* brand header */
  .brand { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .emblem { width: 168px; height: 168px; display: block; }
  h1 {
    margin: 4px 0 0;
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(38px, 10.5vw, 58px);
    line-height: 1.05;
    color: var(--cream);
    text-wrap: balance;
  }
  h1 .amp { color: var(--gold); font-family: Georgia, "Times New Roman", serif; font-style: normal; font-weight: 400; font-size: 0.66em; display: inline-block; padding-inline: 0.025em; vertical-align: 0.035em; }
  .divider { display: flex; align-items: center; gap: 12px; width: min(300px, 80%); }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--gold); opacity: .75; }
  .divider i { width: 8px; height: 8px; background: var(--copper); transform: rotate(45deg); display: block; }
  .by { margin: 0; font-size: 15px; letter-spacing: .14em; color: var(--champagne); }

  /* what we do */
  .offer {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
    column-gap: 12px; row-gap: 6px;
    font-size: 13px; font-weight: 400; letter-spacing: .17em; text-transform: uppercase; color: var(--champagne);
  }
  .offer li + li::before { content: "\2022"; margin-right: 12px; color: var(--champagne); opacity: .7; }
  @media (max-width: 560px) {
    /* Mantener las tres categorías en una sola línea en celulares */
    .offer { flex-direction: row; flex-wrap: nowrap; justify-content: center; column-gap: 3px; row-gap: 0; font-size: clamp(6.5px, 1.85vw, 8.5px); line-height: 1.2; letter-spacing: 0; width: 100%; white-space: nowrap; }
    .offer li { white-space: nowrap; flex: 0 0 auto; }
    .offer li + li::before { display: inline; margin-right: 2px; }
  }
  @media (max-width: 360px) {
    .offer { font-size: 6.5px; letter-spacing: 0; column-gap: 1px; }
    .offer li + li::before { margin-right: 2px; }
  }
  .rule { width: 100%; height: 1px; background: var(--frame); border: 0; margin: 0; }
  .tagline {
    margin: 0; max-width: 100%;
    font-family: var(--font-display); font-style: italic; font-weight: 500;
    font-size: clamp(18px, 3.7vw, 24px); line-height: 1.3; color: var(--cream);
    text-wrap: balance;
  }
  .tagline span { display: block; }

  /* services */
  .service-list-label { margin: -4px 0 -4px; color: var(--gold); font-size: 10px; line-height: 1.5; font-weight: 400; letter-spacing: .13em; text-align: center; text-transform: uppercase; }
  .service-list-label span { padding: 0 3px; color: var(--champagne); }
  .services { list-style: none; margin: 0; padding: 0; width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 8px; justify-items: center; }
  .services li { min-width: 0; width: 100%; max-width: 220px; overflow: hidden; border: 1px solid var(--frame); border-radius: 5px; background: var(--navy); display: flex; flex-direction: column; align-items: center; }
  .services img { display: block; width: 100%; max-width: none; height: auto; aspect-ratio: auto; object-fit: contain; flex: 0 0 auto; margin-bottom: -18px; -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 62%, rgba(0,0,0,.82) 73%, rgba(0,0,0,.48) 85%, rgba(0,0,0,.16) 94%, transparent 100%); mask-image: linear-gradient(to bottom, #000 0%, #000 62%, rgba(0,0,0,.82) 73%, rgba(0,0,0,.48) 85%, rgba(0,0,0,.16) 94%, transparent 100%); }
  .service-card-label { position: relative; display: block; width: 100%; box-sizing: border-box; padding: 26px 4px 14px; background: var(--navy); color: var(--gold); text-align: center; font-size: 10px; line-height: 1.4; letter-spacing: .13em; text-transform: uppercase; }
  @media (min-width: 480px) { .services { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; } }

  /* contact */
  .contact { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 4px; }
  .contact h2 {
    margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 600;
    font-size: 34px; line-height: 1.1; color: var(--cream); text-wrap: balance;
  }
  .kicker { margin: -10px 0 0; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
  .actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 400px; margin-top: 6px; }
  .action {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    color: var(--champagne); text-decoration: none; padding: 6px 2px; border-radius: 14px;
    -webkit-tap-highlight-color: transparent;
  }
  .action .disc {
    width: 76px; height: 76px; border-radius: 50%;
    border: 1.5px solid var(--gold);
    display: grid; place-items: center;
    transition: background-color .18s ease, transform .18s ease;
  }
  .action svg { width: 32px; height: 32px; fill: none; stroke: var(--gold); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .action .lbl { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; }
  .action:hover .disc, .action:focus-visible .disc { background: var(--bg-lift); }
  .action:active .disc { transform: scale(.96); }
  .action:focus-visible, .copy:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .details { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 4px; font-size: 16px; color: var(--cream); }
  .details .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .details .num, .details .handle { letter-spacing: .04em; user-select: all; -webkit-user-select: all; }
  .copy {
    font: inherit; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--gold); background: transparent; border: 1px solid var(--frame); border-radius: 999px;
    padding: 6px 14px; min-height: 32px; cursor: pointer;
  }
  .copy:hover { background: var(--bg-lift); }
  .copy[data-state="done"] { color: var(--cream); border-color: var(--gold); }

  /* where */
  .where { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
  .pin-row { display: flex; align-items: center; gap: 12px; width: 100%; }
  .pin-row::before, .pin-row::after { content: ""; flex: 1; height: 1px; background: var(--gold); opacity: .6; }
  .pin-row svg { width: 22px; height: 22px; fill: none; stroke: var(--cream); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .area { margin: 0; font-size: 14px; letter-spacing: .2em; text-transform: uppercase; color: var(--champagne); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* Responsive refinements: preserve the original look while adapting to narrow screens */
  .card { width: 100%; }
  .services li { background: var(--bg); }
  @media (max-width: 479px) {
    body { padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
    .card { padding: 28px 14px 28px; gap: 24px; }
    .brand { gap: 10px; }
    .emblem { width: clamp(112px, 34vw, 150px); height: auto; }
    h1 { font-size: clamp(36px, 10vw, 48px); }
    .by { font-size: 13px; letter-spacing: .12em; }
    .offer { font-size: 11px; letter-spacing: .13em; }
    .tagline { font-size: clamp(18px, 5vw, 22px); }
    .services { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 8px; }
    .services li { max-width: none; }
    .service-card-label { font-size: clamp(9px, 2.5vw, 10px); letter-spacing: .1em; overflow-wrap: anywhere; }
    .contact h2 { font-size: clamp(29px, 8vw, 34px); }
    .kicker { font-size: 11px; letter-spacing: .16em; }
    .actions { gap: 4px; }
    .action { gap: 8px; padding: 6px 0; }
    .action .disc { width: clamp(54px, 17vw, 68px); height: clamp(54px, 17vw, 68px); }
    .action svg { width: 28px; height: 28px; }
    .action .lbl { font-size: clamp(10px, 3vw, 12px); letter-spacing: .1em; }
    .details { font-size: 14px; }
    .area { font-size: 12px; letter-spacing: .14em; }
  }
  @media (max-width: 340px) {
    .card { padding-left: 10px; padding-right: 10px; }
    .services { gap: 8px 6px; }
    .service-card-label { padding-left: 2px; padding-right: 2px; letter-spacing: .06em; }
    .action .lbl { letter-spacing: .06em; }
  }
  @media (prefers-reduced-motion: reduce) { .action .disc { transition: none; } .action:active .disc { transform: none; } }

  /* Ajuste móvil definitivo: mantener la marca en una sola línea y compactar el lema */
  @media screen and (max-width: 600px) {
    header h1, h1 { font-size: clamp(25px, 7.1vw, 34px) !important; line-height: 1.05 !important; letter-spacing: -0.035em !important; white-space: nowrap !important; }
    .tagline { font-size: clamp(13px, 3.7vw, 16px) !important; line-height: 1.25 !important; letter-spacing: -0.015em !important; max-width: 100% !important; }
    .tagline span { display: block !important; max-width: 100% !important; }
  }
  @media screen and (max-width: 380px) {
    header h1, h1 { font-size: clamp(23px, 6.6vw, 27px) !important; letter-spacing: -0.045em !important; }
    .tagline { font-size: 12.5px !important; line-height: 1.22 !important; }
  }
  /* Ajuste vertical móvil: reducir el espacio vacío arriba y abajo sin cambiar el estilo */
  @media screen and (max-width: 600px) {
    body { padding-top: max(4px, env(safe-area-inset-top, 0px)) !important; padding-bottom: max(4px, env(safe-area-inset-bottom, 0px)) !important; }
    .card { padding-top: 16px !important; padding-bottom: 16px !important; gap: 16px !important; }
    .brand { gap: 7px !important; }
    .emblem { width: clamp(100px, 28vw, 126px) !important; height: auto !important; }
  }
  @media screen and (max-width: 380px) {
    .card { padding-top: 12px !important; padding-bottom: 12px !important; gap: 13px !important; }
    .emblem { width: clamp(92px, 26vw, 108px) !important; }
  }

  /* Ajuste real de espacio vertical en celulares: anula reglas previas más amplias */
  @media screen and (max-width: 600px) {
    html, body { margin: 0 !important; padding-top: 0 !important; padding-bottom: 0 !important; }
    body { padding-left: max(8px, env(safe-area-inset-left, 0px)) !important; padding-right: max(8px, env(safe-area-inset-right, 0px)) !important; }
    .card { margin-top: 0 !important; margin-bottom: 0 !important; padding-top: 8px !important; padding-bottom: 10px !important; gap: 11px !important; }
    .brand { gap: 5px !important; }
    .emblem { width: clamp(82px, 23vw, 108px) !important; height: auto !important; }
    .brand h1 { margin-top: 0 !important; }
    .offer, .rule, .tagline, .service-list-label, .services, .contact, .where { margin-block: 0 !important; }
    .contact { gap: 10px !important; }
    .kicker { margin-top: -3px !important; } /* Baja un poco "Request a quote" en móvil vertical */
    .where { gap: 7px !important; }
  }
  @media screen and (max-width: 380px) {
    .card { padding-top: 6px !important; padding-bottom: 8px !important; gap: 9px !important; }
    .emblem { width: clamp(76px, 21vw, 92px) !important; }
  }

  /* Ajuste final específico para la línea de servicios en móvil */
  @media screen and (max-width: 600px) {
    ul.offer {
      display: flex !important;
      flex-wrap: nowrap !important;
      justify-content: center !important;
      align-items: center !important;
      gap: 0 !important;
      width: 100% !important;
      white-space: nowrap !important;
      font-size: clamp(8px, 2.35vw, 10px) !important;
      line-height: 1.15 !important;
      letter-spacing: 0 !important;
      transform: none !important;
    }
    ul.offer li { flex: 0 0 auto !important; white-space: nowrap !important; }
    ul.offer li + li::before { margin-left: 3px !important; margin-right: 3px !important; }
  }
  @media screen and (max-width: 380px) {
    ul.offer { font-size: clamp(7.2px, 2.2vw, 8.2px) !important; }
    ul.offer li + li::before { margin-left: 2px !important; margin-right: 2px !important; }
  }
</style>
